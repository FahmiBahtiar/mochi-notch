[workspace]
resolver = "3"
members = [
    "apps/mochi-desktop",
    "apps/mochi-cli",
    "crates/mochi-activities",
    "crates/mochi-calendar",
    "crates/mochi-clipboard",
    "crates/mochi-focus",
    "crates/mochi-gaze",
    "crates/mochi-lyrics",
    "crates/mochi-media",
    "crates/mochi-notifications",
    "crates/mochi-prayer",
    "crates/mochi-presence",
    "crates/mochi-shelf",
    "crates/mochi-spring",
    "crates/mochi-store",
    "crates/mochi-tasks",
    "crates/mochi-updates",
    "crates/mochi-water",
    "crates/mochi-weather",
    "crates/mochi-ui",
    "crates/mochi-winrt",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
