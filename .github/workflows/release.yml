name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements
          }

      - name: Build installer
        shell: pwsh
        env:
          MOCHI_GOOGLE_CLIENT_ID: ${{ secrets.MOCHI_GOOGLE_CLIENT_ID }}
          MOCHI_GOOGLE_CLIENT_SECRET: ${{ secrets.MOCHI_GOOGLE_CLIENT_SECRET }}
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v', 'V')
          ./tools/build-installer.ps1 -Version $ver

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Mochi-Setup-*.exe
            dist/Mochi-Setup.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Mochi-Setup-*.exe
            dist/Mochi-Setup.exe
            dist/SHA256SUMS.txt
