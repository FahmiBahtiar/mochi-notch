[package]
name = "mochi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Console CLI for Mochi, for scripts and AI agent hooks"

[[bin]]
name = "mochi-cli"
path = "src/main.rs"

[dependencies]
clap = "4"
serde_json = "1"
mochi-activities = { path = "../../crates/mochi-activities" }

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
trycmd = "1"

[lints]
workspace = true
