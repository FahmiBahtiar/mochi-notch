[package]
name = "mochi-winrt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Windows OS, WinRT, COM, CoreAudio, DPAPI, WinHTTP, and service layer for Mochi"

[dependencies]
base64 = "0.22"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
url = "2"

mochi-activities = { path = "../mochi-activities" }
mochi-calendar = { path = "../mochi-calendar" }
mochi-clipboard = { path = "../mochi-clipboard" }
mochi-focus = { path = "../mochi-focus" }
mochi-gaze = { path = "../mochi-gaze" }
mochi-lyrics = { path = "../mochi-lyrics" }
mochi-media = { path = "../mochi-media" }
mochi-notifications = { path = "../mochi-notifications" }
mochi-prayer = { path = "../mochi-prayer" }
mochi-presence = { path = "../mochi-presence" }
mochi-shelf = { path = "../mochi-shelf" }
mochi-spring = { path = "../mochi-spring" }
mochi-store = { path = "../mochi-store" }
mochi-tasks = { path = "../mochi-tasks" }
mochi-updates = { path = "../mochi-updates" }
mochi-water = { path = "../mochi-water" }
mochi-weather = { path = "../mochi-weather" }

[dependencies.windows]
version = "0.62.2"
features = [
    "ApplicationModel",
    "Devices_Geolocation",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Networking_Connectivity",
    "Storage_Streams",
    "System_Power",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_Multimedia",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.windows-core]
version = "0.62.2"

[dependencies.windows-implement]
version = "0.60.2"

[lints]
workspace = true
