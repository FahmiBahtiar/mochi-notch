[package]
name = "mochi-calendar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Google Calendar event parsing, SafeLinks unwrapping, and reminder logic for Mochi"

[dependencies]
base64 = "0.22"
chrono = "0.4"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
url = "2"

[lints]
workspace = true
